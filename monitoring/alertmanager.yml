# Alertmanager Configuration for Repository Intelligence Scanner

global:
  smtp_smarthost: 'smtp.company.com:587'
  smtp_from: 'alerts@scanner.company.com'
  smtp_auth_username: 'alerts@scanner.company.com'
  smtp_auth_password: 'your-smtp-password'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        service: repo-scanner
      receiver: 'repo-scanner-team'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'devops@company.com'
        subject: '{{ template "email.subject" . }}'
        body: '{{ template "email.body" . }}'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: 'oncall@company.com'
        subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          🚨 **CRITICAL ALERT**

          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          **Service:** {{ .Labels.service }}
          **Started:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}

          **Labels:**
          {{ range .Labels.SortedPairs }}{{ .Name }}: {{ .Value }}
          {{ end }}

          **Annotations:**
          {{ range .Annotations.SortedPairs }}{{ .Name }}: {{ .Value }}
          {{ end }}

          **Runbook:** {{ .Annotations.runbook_url }}

          ---
          {{ end }}
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
    pagerduty_configs:
      - service_key: 'your-pagerduty-service-key'
        description: '{{ .CommonAnnotations.summary }}'
        severity: '{{ .CommonLabels.severity }}'

  - name: 'repo-scanner-team'
    email_configs:
      - to: 'repo-scanner-team@company.com'
        subject: 'Repository Scanner Alert: {{ .GroupLabels.alertname }}'
        body: '{{ template "email.body" . }}'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#repo-scanner-alerts'
        title: 'Repository Scanner: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.body" . }}'
        send_resolved: true

  - name: 'warning'
    email_configs:
      - to: 'devops@company.com'
        subject: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        body: '{{ template "email.body" . }}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      alertname: 'RepoScannerDown'
    target_match:
      alertname: 'RepoScannerHighLatency|RepoScannerHighCPUUsage|RepoScannerHighMemoryUsage'
    equal: ['service']