[tool:pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = src
norecursedirs = validation_data outputs scan_results tmp .git .venv __pycache__ .pytest_cache
addopts =
    -n 4
    --failed-first
    --strict-markers
    --strict-config
    --disable-warnings
    -v
tmp_path_retention_count = 3
tmp_path_retention_policy = failed
markers =
    slow
    integration
    unit

[coverage:run]
source = src
branch = True
omit =
    src/__init__.py
    src/api_server.py  # API server has minimal test coverage currently

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod