[tool:pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = src
norecursedirs = validation_data outputs scan_results tmp .git .venv __pycache__ .pytest_cache
addopts =
    -n 4
    --failed-first
    --strict-markers
    --strict-config
    --disable-warnings
    -v
    --reruns=2
    --reruns-delay=1
    --cache-dir=.pytest_cache
    --cache-show
tmp_path_retention_count = 3
tmp_path_retention_policy = failed
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests with time/memory budgets
    calibration: marks tests for detector accuracy calibration
    adversarial: marks tests with adversarial inputs and edge cases
    property: marks property-based tests for correctness
    security: marks tests related to security functionality
    api: marks tests for API server endpoints
    remote: marks tests for remote repository scanning
    authority: marks tests for authority ceiling and refusal scenarios
    language: marks tests for language adapter functionality
    determinism: marks tests for output determinism verification
    schema: marks tests for JSON schema validation
    ci_only: marks tests that should only run in CI environment
    benchmark: marks tests using pytest-benchmark for performance measurement
    flaky: marks tests that are known to be flaky and should be rerun on failure

[cache]
cache_dir = .pytest_cache

[coverage:run]
source = src
branch = True
omit =
    src/__init__.py
    src/api_server.py  # API server has minimal test coverage currently

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod