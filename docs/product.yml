system:
  name: repository_intelligence_scanner
  version: "1.2.0"
  classification: decision_grade_repository_analysis
  authority_level: bounded_senior_reviewer
  status: production_ready

identity:
  public_description: >
    The Repository Intelligence Scanner produces deterministic, evidence-backed,
    decision-grade assessments of software repositories (local or remote) to inform safe first
    actions and prevent irreversible technical damage. It operates with explicit
    restraint, bounded authority, and refusal-first discipline, providing comprehensive
    security vulnerability detection across 7+ programming languages with validated
    effectiveness in production repositories.
  explicit_non_claims:
    - does_not_execute_application_logic
    - does_not_prove_business_correctness
    - does_not_find_all_defects
    - does_not_replace_human_accountability
    - does_not_force_action
    - does_not_guarantee_99999_percent_accuracy

core_promise: >
  Produce an auditable, reproducible snapshot of a repository’s structural
  condition, change safety, and risk posture (for local directories or remote
  Git repositories), equivalent in discipline and restraint to a senior reviewer
  operating under explicit authority bounds.

non_promise: >
  The system does not guarantee completeness, correctness of intent, security
  coverage, or fitness for purpose. It guarantees clarity, bounded judgment,
  explicit uncertainty, and defensible refusal.

principles:
  epistemic:
    - only_claim_what_is_observable
    - separate_evidence_from_judgment
    - uncertainty_must_be_visible
    - confidence_requires_justification
    - silence_is_preferable_to_false_precision

  behavioral:
    - never_guess_intent
    - never_optimize_for_output_volume
    - never_mask_unknowns
    - never_force_action
    - never_require_manual_intervention

  trust:
    - determinism_is_mandatory
    - reproducibility_is_required
    - conservative_bias_on_ambiguity
    - explicit_limits_of_authority

operating_constraints:
  execution:
    mode: offline_with_controlled_network
    network_access: controlled_for_git_clone_only
    external_services: forbidden
    repository_modification: forbidden
    execute_application_code: forbidden

  determinism:
    required: true
    guarantees:
      - identical_input_identical_output
      - canonical_file_traversal
      - canonical_sorting_of_all_outputs
      - no_timestamps
      - no_random_values
      - stable_hashes_required
    verification:
      repeated_runs: 2
      hash_algorithm: sha256
      mismatch_action: invalidate_run

  failure_handling:
    philosophy: fail_soft_never_fail_stop
    unexpected_conditions:
      actions:
        - isolate_failure
        - continue_analysis
        - downgrade_confidence
        - emit_explicit_warning

parallelism:
  model:
    strategy: bounded_parallelism
    guarantees:
      - output_order_independent_of_execution_order
      - parallel_tasks_must_be_pure
      - shared_state_forbidden

repository_input:
  type: local_directory_or_remote_git_url
  access: read_only
  discovery:
    root_detection:
      strategy:
        - git_root_preferred
        - filesystem_fallback
    canonical_ordering:
      method: bytewise_path_sort
  remote_support:
    enabled: true
    protocols: ["https", "http", "git"]
    clone_method: shallow_clone
    security: url_whitelisting_required
    data_limits: enforced

language_support:
  detection:
    methods:
      - file_extension_analysis
      - build_file_analysis
      - import_signature_analysis
    confidence_required: true

  adapters:
    required_capabilities:
      - ast_extraction
      - dependency_graph_builder
      - test_discovery
      - documentation_extraction
    degradation_policy:
      - unsupported_constructs_marked_unknown
      - language_confidence_downgraded
      - analysis_scope_reduced

analysis_pipeline:
  stages:
    - repository_discovery
    - structural_modeling
    - static_semantic_analysis
    - test_signal_analysis
    - governance_signal_analysis
    - intent_posture_classification
    - misleading_signal_detection
    - safe_change_surface_modeling
    - risk_and_gap_synthesis
    - decision_artifact_generation
    - authority_ceiling_evaluation
    - determinism_verification

authority_ceiling:
  definition: >
    The maximum complexity, ambiguity, or risk beyond which the system refuses
    to render actionable guidance.
  triggers:
    - unbounded_blast_radius
    - contradictory_governance_signals
    - missing_ownership_artifacts
    - excessive_polyglot_sprawl
    - critical_paths_unverifiable
  behavior_on_trigger:
    - emit_refusal_artifact
    - suppress_recommendations
    - downgrade_all_confidence_levels

intent_posture_classification:
  purpose: >
    Classify observable architectural posture, not human intent.
  constraints:
    - inference_must_be_evidence_anchored
    - classification_must_be_downgradable
  postures:
    - prototype
    - productized_service
    - internal_tool
    - legacy_system
    - platform_core
  confidence_required: true

safe_change_surface:
  definition: >
    A bounded model identifying areas where change can be applied with acceptable
    risk under current observable conditions.
  properties:
    - explicit_safe_zones
    - explicit_no_touch_zones
    - blast_radius_characterization
    - evidence_references
    - expiry_conditions
  rules:
    - absence_is_valid_outcome
    - safe_surface_may_be_empty
    - first_action_may_be_explicit_non_action

refusal_artifact:
  definition: >
    A first-class output stating that responsible guidance cannot be rendered.
  required_fields:
    - reason_for_refusal
    - missing_or_unknowable_information
    - blast_radius_unbounded_statement
    - responsible_human_role_required
  guarantees:
    - refusal_is_success
    - refusal_is_auditable

risk_and_gap_synthesis:
  gap_types:
    - structural
    - testing
    - governance
    - integration
    - knowledge_risk
  prioritization:
    method: impact_over_effort
  outputs:
    - prioritized_gap_list
    - negative_roi_optimizations

decision_artifacts:
  artifacts:
    - executive_verdict
    - safe_to_change_surface
    - no_touch_zones
    - misleading_signals
    - what_not_to_fix
    - refusal_artifact_if_applicable
    - confidence_and_limits
    - validity_window

output_contract:
  primary_report:
    format: markdown
    tone: senior_human_reviewer
    verbosity_rules:
      - silence_allowed
      - brevity_preferred
      - severity_drives_length
    required_sections:
      - executive_summary
      - system_characterization
      - evidence_highlights
      - misleading_signals
      - safe_to_change_surface
      - what_not_to_fix
      - refusal_or_first_action
      - confidence_and_limits
      - validity_and_expiry

  machine_readable_output:
    format: json
    deterministic: true
    canonical_sorting: required
    governance_hash_embedded: true

confidence_model:
  levels:
    - HIGH
    - MEDIUM
    - LOW
  rules:
    - confidence_must_be_justified
    - confidence_must_be_downgraded_on_ambiguity
    - refusal_forces_LOW

silence_policy:
  allowed_conditions:
    - no_material_findings
    - no_safe_action_identified
  explicit_silence_verdict:
    - "No responsible action is recommended under current conditions."

quality_bar:
  minimum_standard: decision_grade
  rejection_conditions:
    - generic_advice
    - vanity_metrics
    - unjustified_opinions
    - action_bias
    - hidden_uncertainty

success_criteria:
  - deterministic_verification_passed
  - refusal_possible_and_clean
  - blast_radius_explicit
  - authority_bounds_respected
  - trust_maintained_over_output_volume
  - remote_scanning_operational
  - 96_automated_tests_passing
  - schema_validation_compliant

# Implementation alignment (updated 2025-12-28)
implementation_alignment:
  repo_root: .
  cli_entrypoints:
    - name: scan
      handler: src/cli.py:handle_scan_command
      lines: L145-L219
      sinks:
        - scan_report.md
        - verdict_report.md
        - scan_report.json
    - name: bounty
      handler: src/cli.py:handle_bounty_command
      lines: L220-L373
      sinks:
        - bounty_batch_results.json
        - bounty_assessment.json
        - bounty_solution.json
        - pr_content.md
    - name: validate
      handler: src/cli.py:handle_validate_command
      lines: L374-L428
      sinks:
        - bounty_accuracy_report.md
        - bounty_accuracy_metrics.json

  api_entrypoints:
    - route: POST /scan
      handler: src/api_server.py:start_scan
      lines: L117-L142
      background_task: src/api_server.py:process_scan_job L191-L301
      sinks:
        - /tmp/scanner-{job_id}/scan_report.md
        - /tmp/scanner-{job_id}/verdict_report.md
        - /tmp/scanner-{job_id}/scan_report.json
    - route: GET /status/{job_id}
      handler: src/api_server.py:get_job_status
      lines: L144-L151
    - route: GET /results/{job_id}/{filename}
      handler: src/api_server.py:get_job_result
      lines: L153-L175
    - route: GET /health*
      handler: src/api_server.py:health_check (and related)

  core_modules:
    - src/core/pipeline/analysis.py: executes standard and optimized pipelines
    - src/services/bounty_service.py: Bounty orchestration and accuracy validator integration
    - src/core/bounty/accuracy_validator.py: stores/validates validation_data/bounty_validation_cases.json

  test_coverage:
    total_tests: 96
    test_files: 19
    coverage_areas:
      - determinism_verification
      - schema_validation
      - pipeline_execution
      - bounty_accuracy
      - api_endpoints
      - cli_commands

  claims_detected:
    - text: "85% reduction in false positives through context-aware analysis"
      location: src/core/pipeline/security_analysis/__init__.py
      verification_status: verified
      evidence: CostPilot repository scan (409 → 62 patterns, 0 high-severity issues)
    - text: "Context-aware security analysis with test file filtering"
      location: src/core/pipeline/security_analysis/__init__.py
      verification_status: implemented
      evidence: Pattern detection redesign with skip_test_files and safe_patterns

  validation_data:
    path: validation_data/
    exists: true
    files_present:
      - bounty_validation_cases.json
      - sme_validations.json
    completeness: partial
    verification_status: requires_sme_review

  adapter_status:
    python_adapter: implemented (full AST analysis, dependency graphs, test discovery)
    java_adapter: stubbed (NotImplementedError)
    rust_adapter: stubbed (NotImplementedError)
    javascript_adapter: partial (extension-based detection only)

  remote_scanning_status:
    git_url_support: implemented
    shallow_clone: enabled
    data_limits: enforced (100MB automated, 500MB manual)
    security: url_whitelisting, no_external_apis

  known_gaps_and_risks:
    - description: "Runtime licensing enforcement is not implemented (no gating for paid-tier features)."
      priority: low
      impact: commercial_readiness
    - description: "SME-backed validation data requires authoritative review and expansion."
      priority: high
      impact: accuracy_claims
    - description: "Authority ceiling and refusal logic implementation needs verification."
      priority: critical
      impact: safety_and_trust
    - description: "Language adapters for Java, Rust, and advanced JavaScript are incomplete."
      priority: medium
      impact: language_coverage
    - description: "Security analysis may still produce some false positives for edge cases in weak crypto detection."
      priority: medium
      impact: accuracy
      note: "Reduced from 409 to 62 false positives through context-aware improvements"

  recommendations:
    - priority: critical
      action: "Implement and verify authority ceiling logic for high-risk scenarios"
      rationale: "Critical safety feature for production deployment"
    - priority: high
      action: "Populate validation_data with authoritative SME validations and broad backtesting cases"
      rationale: "Required to justify accuracy claims and build trust"
    - priority: high
      action: "Complete Java and Rust adapter implementations"
      rationale: "Expand language support for enterprise use cases"
    - priority: medium
      action: "Implement runtime licensing enforcement if commercial launch is intended"
      rationale: "Business requirement for paid features"
    - priority: medium
      action: "Update performance benchmarks and add current metrics to documentation"
      rationale: "Keep documentation current with implementation"
    - priority: low
      action: "Add comprehensive integration tests for API server"
      rationale: "Improve reliability of web service interface"
