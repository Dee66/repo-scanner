[project]
name = "repository-intelligence-scanner"
version = "1.1.0"
description = "Decision-grade repository analysis system"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Repository Intelligence Scanner Team"},
]
maintainers = [
    {name = "Repository Intelligence Scanner Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "psutil>=5.9.0",
    "GitPython>=3.1.0",
    "markdown>=3.4.0",
    "requests>=2.28.0",
    "javalang>=0.13.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.2",
    "tree-sitter-typescript>=0.25.2",
    "tree-sitter-java>=0.25.2",
    "tree-sitter-go>=0.25.2",
    "tree-sitter-rust>=0.25.2",
    "tree-sitter-cpp>=0.25.2",
    "tree-sitter-c-sharp>=0.25.2",
    "tree-sitter-php>=0.25.2",
    "tree-sitter-ruby>=0.25.2",
    "tree-sitter-scala>=0.25.2",
    "tree-sitter-swift>=0.25.2",
    "tree-sitter-kotlin>=0.25.2",
    "cryptography>=41.0.0",
    "syft>=0.83.0",
    "grype>=0.64.0",
    "license-expression>=30.4.4",
    "pydot>=1.4.0",
    "graphviz>=0.20.0",
    # New libraries for best-in-class scanner
    "pygit2>=1.15.0",
    "redis>=5.0.0",
    "ray[default]>=2.40.0",
    "kubernetes>=30.0.0",
    "aiofiles>=24.0.0",
    "aiohttp>=3.10.0",
    "semgrep>=1.146.0",
    "scikit-learn>=1.8.0",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "fsspec>=2025.12.0",
    "pathspec>=0.12.1",
    "guesslang>=2.2.1",
    "pygments>=2.19.2",
    "bandit>=1.9.2",
    "safety>=3.7.0",
    "scancode-toolkit>=32.0.0",
    "jinja2>=3.1.6",
]
[project.urls]
Homepage = "https://github.com/example/repo-scanner"
Repository = "https://github.com/example/repo-scanner"
Documentation = "https://repo-scanner.readthedocs.io/"
Issues = "https://github.com/example/repo-scanner/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "aiofiles>=23.2.1",
    "opentelemetry-distro>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-jaeger>=1.21b0",
]
ai = [
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "llama-cpp-python>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
repo-scanner = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]
